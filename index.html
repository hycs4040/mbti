<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커리어 DNA — 나의 일하는 캐릭터</title><style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#36251f;background:#fff7ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 20%,#ffcb9b 0,transparent 34%),radial-gradient(circle at 95% 70%,#ffd1bd 0,transparent 37%),#fff7ec}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #27201d;outline-offset:4px}main{max-width:1080px;margin:auto;padding:28px 20px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:15px;font-weight:1000;letter-spacing:.07em;color:#e94728}.top-tag{border:2px solid #e94728;border-radius:99px;padding:7px 12px;color:#d94324;font-weight:850;font-size:12px}.panel{margin-top:22px;border:2px solid #3e2b22;border-radius:30px;background:#fffdf8;box-shadow:10px 11px 0 #f16c45;overflow:hidden}.hero{display:grid;grid-template-columns:1.15fr .85fr;min-height:510px}.hero-copy{padding:clamp(28px,5vw,68px);align-self:center}.kicker{display:inline-block;font-size:12px;font-weight:1000;letter-spacing:.1em;color:#dc4426;text-transform:uppercase}.hero h1{font-size:clamp(42px,6.3vw,77px);line-height:1.08;letter-spacing:-.075em;margin:19px 0}.hero h1 em{font-style:normal;color:#f05a35}.lead{font-size:17px;line-height:1.8;color:#67544b;max-width:480px}.primary{border:2px solid #3e2b22;background:#ed4f2c;color:white;font-weight:900;padding:16px 25px;border-radius:15px;box-shadow:4px 5px 0 #3e2b22}.primary:hover{background:#d93d22;transform:translateY(-1px)}.secondary{border:2px solid #3e2b22;background:#fff9ee;color:#3e2b22;font-weight:850;padding:14px 20px;border-radius:15px}.secondary:hover{background:#ffe2cc}.primary:disabled{opacity:.42;cursor:not-allowed;transform:none}.stats{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 32px}.stat{background:#ffe4c5;color:#9c3a20;border:1px solid #f6aa80;padding:8px 13px;border-radius:99px;font-weight:850;font-size:13px}.hero-art{position:relative;overflow:hidden;min-height:360px;background:#f96d45;display:grid;place-items:center;border-left:2px solid #3e2b22}.sun{width:270px;height:270px;border-radius:50%;background:#ffdc7b;border:3px solid #3e2b22;box-shadow:15px 15px 0 #e94728;display:grid;place-items:center;transform:rotate(-12deg)}.sun span{font-size:clamp(70px,10vw,125px);font-weight:1000;letter-spacing:-.13em;color:#e94e2d}.burst{position:absolute;font-weight:1000;color:#fff7ec;font-size:24px;transform:rotate(-14deg)}.burst.one{top:12%;left:10%}.burst.two{bottom:12%;right:8%}.quiz{padding:clamp(24px,5vw,55px)}.quiz-head{display:flex;justify-content:space-between;gap:15px;font-size:13px;font-weight:900;color:#b44a30}.track{height:14px;border:2px solid #3e2b22;background:#ffe4d3;border-radius:99px;overflow:hidden;margin:15px 0 34px}.fill{height:100%;background:linear-gradient(90deg,#ffb348,#f05431);transition:width .25s}.quiz h2{font-size:clamp(27px,4vw,41px);line-height:1.4;letter-spacing:-.055em;max-width:850px;margin:12px 0}.hint{color:#79675d;line-height:1.7}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:28px 0 33px}.option{display:flex;align-items:center;gap:13px;text-align:left;min-height:105px;padding:20px;border:2px solid #e8b9a3;border-radius:17px;background:#fff7ed;color:#3e2b22;font-weight:750;line-height:1.55}.option:hover{background:#ffe6d1;border-color:#f05a35}.option.selected{background:#ffceaa;border-color:#e94e2d;box-shadow:4px 4px 0 #e94e2d}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;background:#f45e3b;color:white;font-weight:1000}.nav{display:flex;justify-content:space-between;gap:12px}.result{padding:clamp(24px,5vw,55px)}.result-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center}.result h1{font-size:clamp(34px,5vw,60px);line-height:1.15;letter-spacing:-.06em;margin:14px 0}.result h1 span{color:#e94e2d}.result-desc{font-size:16px;line-height:1.85;color:#665149}.avatar{border:2px solid #3e2b22;border-radius:28px;min-height:230px;background:#ffcf91;display:grid;place-items:center;position:relative;overflow:hidden}.avatar:before{content:'';position:absolute;width:210px;height:210px;border:3px solid #3e2b22;border-radius:50%;background:#ff7650;transform:rotate(-16deg)}.avatar b{position:relative;font-size:90px;font-weight:1000;letter-spacing:-.1em;color:#fff9ed;text-shadow:5px 5px 0 #3e2b22}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:28px}.info{background:#fff5e9;border:2px solid #f0c5a9;border-radius:19px;padding:23px}.info h3{margin:0 0 13px;font-size:17px}.info p{margin:0;color:#68554b;line-height:1.8}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#ffdbbd;border:1px solid #e7a47d;border-radius:99px;padding:8px 11px;font-weight:800;font-size:13px}.match{color:#a53c23;font-weight:900}.contrast{color:#65504a;font-weight:900}.score{display:flex;align-items:center;gap:12px;margin:12px 0;font-size:13px}.score-label{width:140px;flex-shrink:0;font-weight:750}.score-track{flex:1;height:11px;border-radius:20px;background:#f5dccc;overflow:hidden}.score-fill{height:100%;background:#ef6742}.score strong{width:35px;text-align:right}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.note{font-size:12px;color:#816c62;line-height:1.7}.footer{text-align:center;font-size:12px;color:#9b7567;margin-top:28px}@media(max-width:700px){main{padding:16px 14px 42px}.hero,.result-hero{grid-template-columns:1fr}.hero-art{border-left:0;border-top:2px solid #3e2b22;min-height:245px}.sun{width:175px;height:175px}.sun span{font-size:77px}.hero-copy{padding:31px 25px}.hero h1{font-size:45px}.options,.result-grid{grid-template-columns:1fr}.option{min-height:75px}.quiz,.result{padding:25px 20px}.score-label{width:105px}.avatar{min-height:170px}.avatar:before{width:140px;height:140px}.avatar b{font-size:65px}.actions button{flex:1 1 140px}.panel{box-shadow:6px 7px 0 #f16c45}}
</style></head><body><main><header class="top"><div class="brand">s'CAREER DNA / LAB</div><div class="top-tag">10 QUESTIONS · 4 PERSONAS</div></header><div class="panel" id="app" aria-live="polite"></div><div class="footer">이 테스트는 자기이해를 돕는 콘텐츠이며, 과학적으로 검증된 심리검사나 채용 적합성 평가가 아닙니다.</div></main><script>
const types={S:{initial:'S',name:'치밀한 판짜기 마스터',tag:'복잡한 판을 읽는 전략의 달인',desc:'엉킨 문제도 차분하게 풀어내는 설계형 인재. 자료 속에서 패턴을 찾고 논리적인 실행 계획을 세울 때 진가가 드러납니다. 감보다 근거를, 즉흥보다 구조를 선호해요.',strength:['논리적 분석','우선순위 설정','정교한 계획'],jobs:['전략기획','데이터 분석가','재무기획'],tip:'완벽한 준비가 끝나기 전에도 작은 시도를 해보세요. 실행 과정의 정보가 계획을 더 단단하게 만들어 줍니다.',match:'I',contrast:'D',matchWhy:'새로운 발상을 현실적인 계획으로 바꾸는 환상의 조합',contrastWhy:'속도와 검증의 우선순위가 달라 조율이 필요한 조합'},D:{initial:'D',name:'무한도전 선봉장',tag:'가능성을 보면 먼저 뛰는 실행가',desc:'새로운 기회를 발견하면 머뭇거리기보다 움직이는 개척형 인재. 빠르게 판단하고 사람들을 이끌며 도전적인 목표를 결과로 연결하는 데 강점이 있어요.',strength:['추진력','결단력','기회 포착'],jobs:['사업개발','창업가','영업기획'],tip:'속도에 체크리스트 한 장을 더해보세요. 리스크를 미리 짚으면 큰 도전을 더 오래 이어갈 수 있습니다.',match:'C',contrast:'S',matchWhy:'추진력과 관계 조율 능력이 만나 실행력이 커지는 조합',contrastWhy:'빠른 실행과 충분한 분석 사이에서 의견이 갈릴 수 있는 조합'},C:{initial:'C',name:'사람 마음 통역사',tag:'서로 다른 마음을 잇는 협업가',desc:'말로 다 하지 않은 마음까지 세심하게 읽는 연결형 인재. 팀원들의 장점을 발견하고 신뢰를 쌓으며 함께 성과를 내는 과정에서 큰 보람을 느껴요.',strength:['공감과 경청','갈등 조율','협업 촉진'],jobs:['인사·HR','고객경험 기획','조직문화 담당자'],tip:'모두를 만족시키려 하기보다 자신의 의견도 분명히 표현해보세요. 좋은 협업은 건강한 경계에서 시작됩니다.',match:'D',contrast:'I',matchWhy:'사람을 연결하는 힘과 도전 정신이 시너지를 내는 조합',contrastWhy:'합의 중심과 자유로운 실험 사이에서 방식이 달라질 수 있는 조합'},I:{initial:'I',name:'아이디어 폭발 발명가',tag:'평범함을 뒤집는 상상력의 소유자',desc:'남들이 당연하게 여기는 것을 새롭게 보는 창조형 인재. 분야를 넘나들며 아이디어를 연결하고, 자유롭게 실험하며 색다른 해법을 만드는 걸 즐겨요.',strength:['창의적 발상','호기심','관점 전환'],jobs:['브랜드 기획','콘텐츠 기획','UX 기획'],tip:'아이디어에 마감일과 첫 번째 실행 단계를 붙여보세요. 작은 완성이 다음 상상력을 불러옵니다.',match:'S',contrast:'C',matchWhy:'기발한 아이디어와 치밀한 실행 설계가 맞물리는 조합',contrastWhy:'독립적인 실험과 팀의 합의 과정에서 리듬이 다를 수 있는 조합'}};
const questions=[
{q:'새로운 프로젝트를 맡았을 때 가장 먼저 하는 일은?',a:[['목표와 자료를 분석해 계획을 세운다','S'],['일단 빠르게 시도하며 방향을 잡는다','D'],['함께할 사람들의 의견부터 듣는다','C'],['색다른 접근법을 자유롭게 떠올린다','I']]},
{q:'가장 뿌듯한 순간은 언제인가요?',a:[['복잡한 문제의 원인을 정확히 찾아냈을 때','S'],['어려운 목표를 실제 성과로 만들었을 때','D'],['누군가 내 도움으로 성장했을 때','C'],['전에 없던 아이디어가 구현됐을 때','I']]},
{q:'팀 회의에서 자연스럽게 맡는 역할은?',a:[['논점을 정리하고 근거를 확인한다','S'],['결론을 내리고 실행을 이끈다','D'],['다양한 의견을 조율한다','C'],['새로운 대안을 제시한다','I']]},
{q:'예상치 못한 문제가 생겼다면?',a:[['원인과 영향을 차근차근 분석한다','S'],['즉시 대응하고 상황에 맞게 조정한다','D'],['관련된 사람들의 어려움을 먼저 살핀다','C'],['기존 방식 밖에서 해결책을 찾는다','I']]},
{q:'가장 끌리는 업무 환경은?',a:[['기준과 목표가 명확한 환경','S'],['도전적인 목표와 빠른 변화가 있는 환경','D'],['서로 돕고 소통이 활발한 환경','C'],['자율성과 실험이 보장되는 환경','I']]},
{q:'동료들이 나에게 가장 자주 부탁할 것 같은 일은?',a:[['자료 검토와 논리 점검','S'],['어려운 결정과 실행 추진','D'],['의견 중재와 고민 상담','C'],['아이디어 발상과 콘셉트 구상','I']]},
{q:'새로운 기술을 배울 때 선호하는 방식은?',a:[['원리와 구조부터 이해하기','S'],['실제 과제에 바로 적용하기','D'],['다른 사람과 함께 배우기','C'],['여러 기능을 자유롭게 탐색하기','I']]},
{q:'일에서 가장 중요하게 생각하는 가치는?',a:[['정확성과 전문성','S'],['성과와 성장','D'],['신뢰와 긍정적 영향','C'],['자율성과 독창성','I']]},
{q:'선택해야 할 기회가 두 개라면?',a:[['장단점과 데이터를 비교한다','S'],['성장 가능성이 큰 쪽에 도전한다','D'],['함께할 사람들과 관계를 고려한다','C'],['흥미롭고 새로운 경험을 택한다','I']]},
{q:'5년 뒤 어떤 모습이 가장 마음에 드나요?',a:[['깊이 있는 전문성을 인정받는 사람','S'],['새로운 성과와 변화를 이끄는 사람','D'],['사람들의 성장을 돕는 사람','C'],['독창적인 결과물을 만드는 사람','I']]}
];
const KEY='career-dna-last-result-v2';let step=-1,answers=Array(questions.length).fill(null),saved=null;const app=document.getElementById('app');try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&types[raw.winner]&&Array.isArray(raw.answers)&&raw.answers.length===10&&raw.answers.every(n=>Number.isInteger(n)&&n>=0&&n<4))saved=raw}catch(e){}function start(){answers=Array(10).fill(null);step=0;render()}function render(){if(step===-1){app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="kicker">FIND YOUR WORK PERSONA</span><h1>내 안의<br><em>커리어 DNA</em>를<br>깨워봐!</h1><p class="lead">일할 때 드러나는 나만의 캐릭터는? 10가지 선택으로 발견하는 4가지 커리어 페르소나.</p><div class="stats"><span class="stat">10문항</span><span class="stat">약 2분</span><span class="stat">4가지 결과</span></div><button class="primary" id="start">테스트 시작하기 →</button>${saved?'<button class="secondary" id="saved" style="margin:10px 0 0 10px">지난 결과 보기</button>':''}</div><div class="hero-art" aria-hidden="true"><span class="burst one">FIND YOUR TYPE!</span><div class="sun"><span>DNA!</span></div><span class="burst two">WORK YOUR WAY</span></div></section>`;document.getElementById('start').onclick=start;if(saved)document.getElementById('saved').onclick=()=>showResult(saved);return}if(step===10){const scores={S:0,D:0,C:0,I:0};answers.forEach((a,i)=>scores[questions[i].a[a][1]]++);const winner=['S','D','C','I'].reduce((b,k)=>scores[k]>scores[b]?k:b,'S');saved={winner,scores,answers:[...answers]};try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}showResult(saved);return}const q=questions[step];app.innerHTML=`<section class="quiz"><div class="quiz-head"><span>CAREER DNA TEST</span><span>${step+1} / 10</span></div><div class="track" role="progressbar" aria-label="테스트 진행률" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${step+1}"><div class="fill" style="width:${(step+1)*10}%"></div></div><span class="kicker">QUESTION ${String(step+1).padStart(2,'0')}</span><h2>${q.q}</h2><p class="hint">가장 나다운 답변 하나를 골라주세요.</p><div class="options">${q.a.map(([label],i)=>`<button class="option ${answers[step]===i?'selected':''}" data-i="${i}" aria-pressed="${answers[step]===i}"><span class="letter">${'ABCD'[i]}</span><span>${label}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="back">이전</button><button class="primary" id="next" ${answers[step]===null?'disabled':''}>${step===9?'결과 확인하기':'다음 →'}</button></div></section>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.i);render()});document.getElementById('back').onclick=()=>{step=step===0?-1:step-1;render()};document.getElementById('next').onclick=()=>{if(answers[step]!==null){step++;render()}}}
function summary(data){const t=types[data.winner];return `나의 커리어 DNA: ${t.name}\n${t.tag}\n${t.desc}\n대표 강점: ${t.strength.join(', ')}\n추천 직무: ${t.jobs.join(', ')}\n잘 맞는 유형: ${types[t.match].name}\n다른 리듬의 유형: ${types[t.contrast].name}\n성장 팁: ${t.tip}`}
function showResult(data){step=11;const t=types[data.winner];app.innerHTML=`<section class="result"><span class="kicker">YOUR CAREER DNA · RESULT</span><div id="capture"><div class="result-hero"><div><h1>나는 <span>${t.name}</span></h1><div class="stat" style="display:inline-block">${t.tag}</div><p class="result-desc">${t.desc}</p></div><div class="avatar" aria-hidden="true"><b>${t.initial}!</b></div></div><div class="result-grid"><div class="info"><h3>나의 대표 강점</h3><div class="chips">${t.strength.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="info"><h3>추천 직무 3가지</h3><p>${t.jobs.map((x,i)=>`${i+1}. ${x}`).join('<br>')}</p></div><div class="info"><h3>잘 맞는 유형</h3><p><span class="match">${types[t.match].name}</span><br>${t.matchWhy}</p></div><div class="info"><h3>서로 다른 리듬의 유형</h3><p><span class="contrast">${types[t.contrast].name}</span><br>${t.contrastWhy}</p></div><div class="info"><h3>나를 위한 성장 팁</h3><p>${t.tip}</p></div><div class="info"><h3>나의 성향 분포</h3>${['S','D','C','I'].map(k=>`<div class="score"><span class="score-label">${types[k].name}</span><div class="score-track"><div class="score-fill" style="width:${data.scores[k]*10}%"></div></div><strong>${data.scores[k]*10}%</strong></div>`).join('')}</div></div></div><p class="note">궁합은 협업 스타일을 재미있게 비교한 것으로, 사람이나 직업의 실제 적합성을 판단하지 않습니다. 동점은 S → D → C → I 순서로 결정합니다.</p><div class="actions"><button class="primary" id="retry">다시 테스트하기</button><button class="secondary" id="copy">결과 복사</button><button class="secondary" id="saveimg">결과 이미지 저장</button></div></section>`;document.getElementById('retry').onclick=start;document.getElementById('copy').onclick=async()=>{const msg=summary(data);try{await navigator.clipboard.writeText(msg);document.getElementById('copy').textContent='복사 완료'}catch(e){const ta=document.createElement('textarea');ta.value=msg;document.body.append(ta);ta.select();try{document.execCommand('copy');document.getElementById('copy').textContent='복사 완료'}catch(e2){window.prompt('아래 내용을 복사하세요',msg)}ta.remove()}};document.getElementById('saveimg').onclick=()=>saveImage(data)}
function saveImage(data){const t=types[data.winner],canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1080;canvas.height=1500;const W=1080;ctx.fillStyle='#fff8ed';ctx.fillRect(0,0,W,1500);ctx.fillStyle='#ed4f2c';ctx.fillRect(0,0,W,22);function text(s,x,y,size=30,color='#38271f',weight=700){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui, sans-serif`;ctx.fillText(s,x,y)}function wrap(s,x,y,maxWidth,size=28,line=43,color='#59483f',weight=500){ctx.font=`${weight} ${size}px system-ui, sans-serif`;ctx.fillStyle=color;let row='',yy=y;for(const ch of s){if(ctx.measureText(row+ch).width>maxWidth&&row){ctx.fillText(row,x,yy);yy+=line;row=ch}else row+=ch}if(row){ctx.fillText(row,x,yy);yy+=line}return yy}function section(title,y){ctx.fillStyle='#ffdfc6';ctx.fillRect(55,y,970,53);text(title,75,y+37,25,'#b13f25',900);return y+92}text('CAREER DNA / LAB',55,92,26,'#d94627',900);text('YOUR WORK PERSONA',55,149,20,'#b45b42',800);text(t.name,55,240,58,'#e84b2a',900);text(t.tag,55,293,27,'#6a4434',700);let y=wrap(t.desc,55,357,960,27,44)+25;y=section('MY STRENGTHS',y);text(t.strength.join('   /   '),65,y,27);y+=60;y=section('RECOMMENDED JOBS',y);t.jobs.forEach((j,i)=>{text(`${i+1}. ${j}`,65,y,27);y+=46});y+=12;y=section('BEST MATCH',y);text(types[t.match].name,65,y,29,'#d44c2d',850);y=wrap(t.matchWhy,65,y+44,935,23,35)+18;y=section('DIFFERENT RHYTHM',y);text(types[t.contrast].name,65,y,29,'#624c41',850);y=wrap(t.contrastWhy,65,y+44,935,23,35)+18;y=section('GROWTH TIP',y);y=wrap(t.tip,65,y,935,25,40)+12;y=section('MY DNA SCORES',y);['S','D','C','I'].forEach(k=>{text(types[k].name,65,y,23);ctx.fillStyle='#f4d9c7';ctx.fillRect(410,y-22,490,20);ctx.fillStyle='#ef6742';ctx.fillRect(410,y-22,490*data.scores[k]/10,20);text(`${data.scores[k]*10}%`,920,y,23);y+=48});text('For self-discovery and fun, not a validated career assessment.',55,1462,18,'#8c7468',500);const a=document.createElement('a');a.download='career-dna-result.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}
render();
